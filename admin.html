<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ShadowLoft | Control Room</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><main><a class="mark" href="index.html">SHADOW<span>LOFT</span></a><section id="login"><p class="eyebrow">Restricted frequency</p><h1>Control Room</h1><p>Authenticate to tune the house signal.</p><form id="loginForm"><label>Operator<input id="username" autocomplete="username" required></label><label>Passphrase<input id="password" type="password" autocomplete="current-password" required></label><button>Enter the loft ↗</button><div id="loginNote" role="alert"></div></form></section><section id="panel" hidden><p class="eyebrow">Authenticated · Local console</p><h1>Tune the Signal</h1><p class="notice"><strong>Static-site notice:</strong> settings saved here affect this browser only. Global publishing requires a secure server-side control plane.</p><form id="configForm"><label>Source type<select id="type"><option value="channel">YouTube channel ID</option><option value="playlist">Playlist ID</option><option value="video">Video ID</option></select></label><label>Source ID<input id="source" placeholder="UC… / PL… / video ID" required></label><label>Public channel URL<input id="channelUrl" type="url" placeholder="https://youtube.com/@yourchannel"></label><button>Save local signal ↗</button><button type="button" class="ghost" id="clear">Clear</button><div id="saveNote" role="status"></div></form><a class="return" href="index.html">← Return to ShadowLoft</a></section></main><script src="admin.js"></script></body></html>
